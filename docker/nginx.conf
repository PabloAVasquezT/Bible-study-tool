server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Serve the .gz files made at build time to clients that accept gzip.
    gzip_static on;

    # Note: an add_header inside a location replaces all the server-level ones,
    # so each location includes the security headers itself.

    # Build assets have a content hash in their name, so they never change.
    # ^~ keeps the file rule below from taking over these paths.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Bible data keeps its name across deploys: revalidate it with the ETag.
    # A missing file must be a 404, not the app's index.html.
    location ^~ /data/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Any other missing file (favicon.ico, an old asset...) is a 404, not the app.
    location ~ \.[a-zA-Z0-9]+$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Any other path is a route of the app, such as /kjv/jhn/3/16.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
